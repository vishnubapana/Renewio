<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">How Renewio renews an app</title>
  <desc id="desc">Four steps: pick a source, refresh the signing profile, resign the IPA, install on a paired device.</desc>

  <rect width="1200" height="280" rx="26" fill="#0A0A0F"/>
  <rect x="1" y="1" width="1198" height="278" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Connectors -->
  <path d="M278 120 H322" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M578 120 H622" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M878 120 H922" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Step 1 -->
  <g transform="translate(56 48)">
    <rect width="222" height="184" rx="16" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="36" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">01</text>
    <text x="20" y="74" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Source</text>
    <text x="20" y="108" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">GitHub release</text>
    <text x="20" y="134" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">or local .ipa</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(356 48)">
    <rect width="222" height="184" rx="16" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="36" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">02</text>
    <text x="20" y="74" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Provision</text>
    <text x="20" y="108" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Xcode Personal</text>
    <text x="20" y="134" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Team refresh</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(656 48)">
    <rect width="222" height="184" rx="16" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="36" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">03</text>
    <text x="20" y="74" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Resign</text>
    <text x="20" y="108" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">codesign with</text>
    <text x="20" y="134" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">your Team ID</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(956 48)">
    <rect width="188" height="184" rx="16" fill="#1A1A24" stroke="#F59E0B" stroke-opacity="0.35"/>
    <text x="20" y="36" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">04</text>
    <text x="20" y="74" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">Install</text>
    <text x="20" y="108" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">devicectl to</text>
    <text x="20" y="134" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">paired device</text>
  </g>
</svg>
