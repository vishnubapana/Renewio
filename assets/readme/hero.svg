<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Renewio</title>
  <desc id="desc">macOS menu bar app that renews Personal Team–signed apps on Apple TV, iPhone, and iPad from GitHub or a local IPA, with a live signing countdown.</desc>

  <defs>
    <radialGradient id="amberGlow" cx="82%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12121A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0A0A0F"/>
  <rect width="1200" height="380" rx="26" fill="url(#amberGlow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Title -->
  <g transform="translate(56 52)">
    <text x="0" y="0" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">MACOS · MENU BAR</text>
    <text x="0" y="72" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="700">Renewio</text>
    <text x="0" y="118" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">
      Renew signed apps on Apple TV, iPhone &amp; iPad
    </text>
    <text x="0" y="152" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">
      before your Personal Team profile expires.
    </text>

    <g transform="translate(0 196)">
      <rect width="148" height="36" rx="10" fill="#1A1A24" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="74" y="24" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Apple CLI</text>

      <rect x="160" width="168" height="36" rx="10" fill="#1A1A24" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="244" y="24" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">GitHub / IPA</text>

      <rect x="340" width="156" height="36" rx="10" fill="rgba(245,158,11,0.14)" stroke="#F59E0B" stroke-opacity="0.35"/>
      <text x="418" y="24" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">7-day clock</text>
    </g>
  </g>

  <!-- Proof panel mirrors the real popover -->
  <g transform="translate(700 48)">
    <rect width="444" height="284" rx="18" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <!-- Top bar: equal-height device pills + actions -->
    <g transform="translate(18 22)">
      <!-- Living Room (selected) -->
      <rect width="118" height="22" rx="11" fill="#F59E0B"/>
      <text x="14" y="15" fill="#0A0A0F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">▣</text>
      <text x="30" y="15" fill="#0A0A0F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">Living Room</text>

      <!-- Second device (same height, outline + name) -->
      <rect x="126" width="92" height="22" rx="11" fill="none" stroke="#F59E0B" stroke-opacity="0.85" stroke-width="1.25"/>
      <text x="140" y="15" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">▢</text>
      <text x="156" y="15" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600">iPhone</text>

      <!-- + gear x -->
      <rect x="300" width="24" height="22" rx="6" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="312" y="15" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">+</text>
      <rect x="330" width="24" height="22" rx="6" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="342" cy="11" r="3.5" fill="none" stroke="#A1A1AA" stroke-width="1.4"/>
      <circle cx="342" cy="11" r="1.2" fill="#A1A1AA"/>
      <rect x="360" width="24" height="22" rx="6" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M354 8 l8 8 M362 8 l-8 8" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- App card -->
    <g transform="translate(18 62)">
      <rect width="408" height="120" rx="14" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="16" y="32" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Nuvio TV</text>
      <text x="108" y="32" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">v3.5.2</text>

      <circle cx="22" cy="58" r="4" fill="#4ADE80"/>
      <text x="34" y="62" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Active</text>
      <text x="88" y="62" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">6d 3h</text>
      <text x="158" y="62" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">· Nov 28</text>

      <rect x="16" y="80" width="300" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="16" y="80" width="220" height="3" rx="1.5" fill="#4ADE80"/>

      <rect x="344" y="28" width="44" height="44" rx="10" fill="#F59E0B"/>
      <path d="M358 42 a9 9 0 1 1 7 3.5" fill="none" stroke="#0A0A0F" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M372 38 l3.5 3.5 -3.5 3.5" fill="none" stroke="#0A0A0F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(18 210)">
      <text x="0" y="0" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">GitHub IPA → resign → install</text>
      <text x="0" y="28" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">xcodebuild · codesign · devicectl</text>
    </g>
  </g>
</svg>
