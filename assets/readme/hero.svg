<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Renewio</title>
  <desc id="desc">macOS menu bar app that renews Personal Team–signed apps on Apple TV, iPhone, and iPad from GitHub or a local IPA, with a live signing countdown.</desc>

  <defs>
    <radialGradient id="amberGlow" cx="82%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12121A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="26" fill="#0A0A0F"/>
  <rect width="1200" height="380" rx="26" fill="url(#amberGlow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Title block -->
  <g transform="translate(56 52)">
    <text x="0" y="0" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">MACOS · MENU BAR</text>
    <text x="0" y="72" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="700">Renewio</text>
    <text x="0" y="118" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">
      Renew signed apps on Apple TV, iPhone &amp; iPad
    </text>
    <text x="0" y="152" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">
      before your Personal Team profile expires.
    </text>

    <!-- Meta chips -->
    <g transform="translate(0 196)">
      <rect width="148" height="36" rx="10" fill="#1A1A24" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="74" y="24" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Apple CLI</text>

      <rect x="160" width="168" height="36" rx="10" fill="#1A1A24" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="244" y="24" text-anchor="middle" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">GitHub / IPA</text>

      <rect x="340" width="156" height="36" rx="10" fill="rgba(245,158,11,0.14)" stroke="#F59E0B" stroke-opacity="0.35"/>
      <text x="418" y="24" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">7-day clock</text>
    </g>
  </g>

  <!-- Proof panel: countdown card + renew cycle -->
  <g transform="translate(700 48)">
    <rect width="444" height="284" rx="18" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <!-- Fake menu-bar strip -->
    <rect x="18" y="18" width="408" height="36" rx="10" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="40" cy="36" r="5" fill="#F59E0B"/>
    <path d="M52 36 a8 8 0 1 1 6.5-3.5" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <path d="M67 32 l3 3 -3 3" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="41" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Renewio</text>
    <rect x="330" y="26" width="28" height="20" rx="6" fill="#1A1A24" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="366" y="26" width="44" height="20" rx="6" fill="#F59E0B"/>

    <!-- Device pills -->
    <g transform="translate(18 70)">
      <rect width="92" height="24" rx="12" fill="#F59E0B"/>
      <text x="46" y="16" text-anchor="middle" fill="#0A0A0F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">Apple TV</text>
      <rect x="100" width="78" height="24" rx="12" fill="none" stroke="#F59E0B" stroke-opacity="0.7"/>
      <text x="139" y="16" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">iPhone</text>
      <rect x="186" width="64" height="24" rx="12" fill="none" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="218" y="16" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600">iPad</text>
    </g>

    <!-- App countdown card -->
    <g transform="translate(18 110)">
      <rect width="408" height="96" rx="14" fill="#0A0A0F" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="18" y="30" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Nuvio TV</text>
      <text x="110" y="30" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">v3.5.2</text>
      <circle cx="24" cy="56" r="4" fill="#4ADE80"/>
      <text x="36" y="60" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Active</text>
      <text x="92" y="60" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">4d 11h</text>
      <rect x="18" y="74" width="280" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="18" y="74" width="168" height="4" rx="2" fill="#4ADE80"/>
      <rect x="336" y="26" width="52" height="44" rx="10" fill="#F59E0B"/>
      <path d="M354 40 a10 10 0 1 1 8 4" fill="none" stroke="#0A0A0F" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M370 36 l4 4 -4 4" fill="none" stroke="#0A0A0F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Pipeline strip -->
    <g transform="translate(18 226)">
      <text x="0" y="0" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">GitHub IPA → resign → install</text>
      <text x="0" y="28" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">xcodebuild · codesign · devicectl</text>
    </g>
  </g>
</svg>
