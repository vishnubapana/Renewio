name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: RenewioTests
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project Renewio/Renewio.xcodeproj \
            -scheme Renewio \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -only-testing:RenewioTests \
            CODE_SIGN_IDENTITY="-" \
            test
